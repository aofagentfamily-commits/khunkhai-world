<!doctype html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#e9a5cb"><meta name="description" content="เกมทายใจคู่รัก เล่นด้วยกัน เลือกคำถามและสร้างบทลงโทษของตัวเอง"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css"><title>รู้ใจแค่ไหน? · Love Match V2</title></head>
<body><main class="app"><div class="orb orb-a"></div><div class="orb orb-b"></div><div class="orb orb-c"></div>
<header class="header"><button id="logoBtn" class="logo" aria-label="กลับหน้าแรก"><span class="logo-heart">♥</span><span><strong>รู้ใจแค่ไหน?</strong><small>LOVE MATCH</small></span></button><div class="header-actions"><button class="icon-btn" id="manageBtn" aria-label="จัดการคำถามและบทลงโทษ" title="จัดการรายการ">⚙</button><button class="icon-btn" id="soundBtn" aria-label="เปิดหรือปิดเสียงประกอบ" title="เสียงเอฟเฟกต์">♪</button></div></header>
<section class="hero"><span class="eyebrow">✦ OUR LITTLE LOVE GAME ✦</span><h1 id="pageTitle">รู้ใจแค่ไหน <span>♡</span></h1><p id="pageSub">เกมทายใจสำหรับเราสองคน ลุ้นคำตอบและการ์ดภารกิจสุดน่ารัก</p></section>
<div class="container"><section class="score-card hidden" id="scoreBoard" aria-label="คะแนน"><div class="player-score"><span id="scoreName0">ผู้เล่น 1</span><strong id="score0">0</strong><small>คะแนน</small></div><div class="middle-score"><span>♥</span><small id="roundIndicator">รอบ 1 / 10</small></div><div class="player-score"><span id="scoreName1">ผู้เล่น 2</span><strong id="score1">0</strong><small>คะแนน</small></div></section>
<section class="view" id="view" aria-live="polite"></section></div>
<footer>สร้างเพื่อรอยยิ้มของเราสองคน ✿ <span>เล่นได้โดยไม่ต้องสมัครสมาชิก</span></footer>
</main><dialog id="managerDialog" class="manager-dialog"><div class="dialog-head"><div><small>YOUR LOVE MATCH</small><h2>จัดการเกม ♡</h2></div><button id="closeManager" class="icon-btn dark" aria-label="ปิด">✕</button></div><div class="manager-tabs"><button data-manager-tab="penalties" class="active">🎁 บทลงโทษ</button><button data-manager-tab="questions">💌 คำถาม</button></div><div id="managerBody" class="manager-body"></div></dialog>
<dialog id="confirmDialog" class="confirm-dialog"><h2 id="confirmTitle">ยืนยัน</h2><p id="confirmText"></p><div class="actions"><button class="btn secondary" id="confirmCancel">ยกเลิก</button><button class="btn primary" id="confirmYes">ยืนยัน</button></div></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div><script src="./app.js" defer></script></body></html>
